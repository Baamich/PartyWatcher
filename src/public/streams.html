  <!DOCTYPE html>
  <html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="/js/i18n.js?v=5" data-ns="streams"></script>
    <script src="/js/theme.js?v=2"></script>
    <script src="/js/favicon.js"></script>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
    <link rel="stylesheet" href="/css/common.css?v=2" />
    <link rel="stylesheet" href="/streams/streams.css?v=3" />
    <title data-i18n="streams.pageTitle">Party Watcher — Трансляции</title>
  </head>
  <body>
    <div class="page-header">
      <div class="brand-row">
        <a href="/streams.html" class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
            <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="brand-stack">
            <span class="brand-text"><span class="brand-party">Party</span> <span class="brand-watcher">Watcher</span></span>
            <span class="brand-live-tag" data-no-i18n>LIVE</span>
          </span>
        </a>
        <div data-lang-switch></div>
      </div>

      <div class="header-right">
        <div class="corner-menu">
          <a class="icon-btn profile-btn hidden" id="meLink" href="/" data-i18n-title="common.header.profile"><span id="meName" data-no-i18n></span></a>
          <button class="icon-btn theme-toggle" data-click="toggleTheme" data-i18n-title="common.header.theme">🌙</button>
          <button class="icon-btn my-profile-btn" data-click="goToMyProfile" data-i18n="common.header.streamProfile">👤 Стрим-профиль</button>
        </div>
      </div>
    </div>

    <div class="streams-page">
      <!-- слева: меню сайта и подписки -->
      <aside class="streams-left">
        <nav class="nav-sidebar">
          <button type="button" class="page-nav-btn" data-click="navigateWithFade" data-arg="/news" data-i18n="common.nav.news">📰 Новости</button>
          <button type="button" class="page-nav-btn" data-click="navigateWithFade" data-arg="/" data-i18n="common.nav.rooms">🏠 Комнаты</button>
          <button type="button" class="page-nav-btn active" data-click="navigateWithFade" data-arg="/streams.html" data-i18n="common.nav.streams">📡 Прямые трансляции</button>
        </nav>

        <section id="followSide" class="follow-side">
          <div class="side-head">
            <h2 data-i18n="streams.following">Подписки</h2>
            <button type="button" id="followSideToggle" class="side-toggle" title="Свернуть" data-i18n-title="streams.collapse">«</button>
          </div>
          <div id="followList" class="follow-list" data-no-i18n></div>
        </section>
      </aside>

      <main id="streamsMain" class="streams-main">
        <div class="streams-search-wrap">
          <input id="streamerSearchInput" type="text" placeholder="Поиск по имени стримера" data-i18n-placeholder="streams.searchPh"
                autocomplete="off"
                data-keydown="handleStreamerSearchKey" data-event
                data-input="handleStreamerSearchInput"
                data-blur="hideSuggestionsSoon" />
          <button type="button" class="search-icon-btn" data-click="onStreamerSearch" aria-label="Искать" data-i18n-aria-label="common.search">🔍</button>
          <div id="searchSuggestions" class="search-suggestions hidden"></div>
        </div>

        <!-- главная: активные и категории -->
        <div id="homeView">
          <section class="streams-section">
            <div class="streams-section-head">
              <h2 class="section-title">
                <button type="button" class="section-link" data-view="active"><span data-i18n="streams.active">Активные стримеры</span><span class="chev">›</span></button>
              </h2>
              <span class="streams-section-hint" data-i18n="streams.activeHint">часто стримят последние 30 дней</span>
            </div>
            <div class="row-scroller"><div id="activeStreamersRow" class="active-streamers-row" data-no-i18n></div></div>
          </section>
          <div id="categoryRows" data-no-i18n></div>
        </div>

        <!-- полный список: все, активные или одна категория -->
        <div id="listView" class="hidden">
          <div class="list-head">
            <button type="button" id="listBackBtn" class="icon-btn" data-i18n="streams.back">← Назад</button>
            <div id="listCover" class="list-cover hidden"></div>
            <div class="list-head-text" data-no-i18n>
              <h2 id="listTitle"></h2>
              <span id="listCount" class="streams-section-hint"></span>
            </div>
          </div>
          <div id="listGrid" class="streamers-grid" data-no-i18n></div>
        </div>
      </main>

      <!-- справа: все стримеры столбиком -->
      <aside class="streams-right">
        <div class="side-head">
          <h2 class="section-title">
            <button type="button" class="section-link" data-view="all"><span data-i18n="streams.all">Все стримеры</span><span class="chev">›</span></button>
          </h2>
        </div>
        <div id="allList" class="side-list" data-no-i18n></div>
      </aside>
    </div>

    <script src="/js/api.js?v=2"></script>
    <script src="/js/actions.js?v=3"></script>
    <script src="/js/page-transition.js"></script>
    <script src="/streams/streams.js?v=5"></script>
    <script src="/js/live-notify.js?v=1"></script>
  </body>
  </html>
