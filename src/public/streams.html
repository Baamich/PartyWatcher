<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/streams/streams.css" />
  <title>PartyWatcher — Трансляции</title>
</head>
<body>
  <div class="page-header">
    <a href="/index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
        <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
    </a>

    <div class="header-right">
      <div class="corner-menu">
        <span class="corner-name" id="meName"></span>
        <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="location.href='/index.html'">Комнаты</button>
      </div>
      <button class="icon-btn my-profile-btn" onclick="goToMyProfile()">👤 Мой профиль</button>
    </div>
  </div>

  <div class="streams-layout">
    <div class="streams-search-wrap">
      <input id="streamerSearchInput" type="text" placeholder="Поиск по имени стримера" onkeydown="handleStreamerSearchKey(event)" />
      <button type="button" class="search-icon-btn" onclick="onStreamerSearch()" aria-label="Искать">🔍</button>
    </div>

    <section class="streams-section">
      <div class="streams-section-head">
        <h2>Активные стримеры</h2>
        <span class="streams-section-hint">часто стримящие за последнее время</span>
      </div>
      <!-- будет потом считываться по итогу окончания стрима (накопленные часы эфира) -->
      <div id="activeStreamersRow" class="active-streamers-row"></div>
    </section>

    <section class="streams-section">
      <h2>Все стримеры</h2>
      <div id="streamersGrid" class="streamers-grid"></div>
    </section>
  </div>

  <script src="/js/api.js"></script>
  <script src="/streams/streams.js"></script>
</body>
</html>
