<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/workbench/workbench.css" />
  <title>PartyWatcher — Творческая студия</title>
</head>
<body>
  <div class="page-header">
    <a href="/index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
        <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
    </a>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn" onclick="goToMyStreamerProfile()">← Профиль</button>
        <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </div>

  <div id="saveToast" class="save-toast hidden"></div>

  <div class="wb-layout">
    <nav class="wb-nav">
      <button type="button" class="wb-nav-btn active">📡 Управление трансляцией</button>
      <button type="button" class="wb-nav-btn" onclick="alert('Скоро появится')">📰 Новости</button>
      <button type="button" class="wb-nav-btn" onclick="location.href='/workbench/channel-activity.html'">🛡️ Актив канала</button>
    </nav>

    <div class="wb-main">
      <section class="wb-panel wb-key-panel">
        <div class="wb-key-row">
          <input id="streamKeyInput" class="wb-key-input" readonly placeholder="Ключ ещё не создан" />
          <button type="button" class="icon-btn" onclick="copyStreamKey()">📋</button>
          <button type="button" id="generateKeyBtn" class="icon-btn" onclick="onGenerateKeyClick()">🔄 Сгенерировать</button>
        </div>
        <p class="wb-hint">Ключ вставляется в OBS: сервер <code>rtmp://live.partywatcher.de/live</code>, ключ потока — из поля выше.</p>
      </section>

      <section class="wb-panel">
        <div id="playerOffline" class="wb-player-offline">Стрим сейчас офлайн</div>
        <video id="playerVideo" class="wb-player hidden" controls muted playsinline></video>
      </section>

      <section class="wb-panel">
        <label class="auth-label" for="streamTitleInput">Название стрима</label>
        <input id="streamTitleInput" maxlength="140" placeholder="О чём стрим?" />

        <label class="auth-label" for="streamDescInput">Описание</label>
        <textarea id="streamDescInput" rows="4" maxlength="2000" placeholder="Расскажи подробнее"></textarea>

        <button type="button" class="auth-submit" onclick="saveSettings()">Сохранить</button>
      </section>
    </div>

    <aside class="wb-chat">
      <div class="wb-chat-head">
        <span>Чат</span>
        <span class="wb-viewers">👁 <span id="viewersCount">0</span></span>
      </div>
      <div id="chatMessages" class="wb-chat-messages"></div>
      <div class="wb-chat-input-row">
        <input id="chatInput" placeholder="Написать в чат…" onkeydown="handleChatKey(event)" />
        <button type="button" onclick="sendChatMessage()">➤</button>
      </div>
    </aside>
  </div>

  <div id="timeoutModal" class="modal hidden">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closeTimeoutModal()">×</button>
      <h3 id="timeoutModalName"></h3>
      <div class="wb-timeout-inputs">
        <input id="timeoutHours" type="number" min="0" max="99" value="0" /> ч
        <input id="timeoutMinutes" type="number" min="0" max="59" value="5" /> м
        <input id="timeoutSeconds" type="number" min="0" max="59" value="0" /> с
      </div>
      <button type="button" class="auth-submit" onclick="confirmTimeout()">Ограничить</button>
    </div>
  </div>

  <div id="regenConfirmModal" class="modal hidden">
    <div class="modal-content">
      <button type="button" class="modal-close" onclick="closeRegenConfirm()">×</button>
      <h3>Сгенерировать новый ключ?</h3>
      <p class="wb-hint">Старый ключ сразу перестанет работать — если сейчас идёт трансляция через него, она оборвётся.</p>
      <button type="button" class="auth-submit" onclick="confirmRegenerateKey()">Да, сгенерировать</button>
      <button type="button" class="icon-btn" onclick="closeRegenConfirm()">Отмена</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/reconnect-schedule.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/workbench/workbench.js"></script>
</body>
</html>
