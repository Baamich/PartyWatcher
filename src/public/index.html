<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/index.css" />
  <title>PartyWatcher</title>
</head>
<body>
  <div id="authBox">
    <h2>Вход</h2>
    <input id="loginInput" placeholder="Логин или email" />
    <input id="passwordInput" type="password" placeholder="Пароль" />
    <button onclick="login()">Войти</button>

    <h2>Регистрация</h2>
    <input id="regUsername" placeholder="Username" />
    <input id="regEmail" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Пароль" />
    <button onclick="register()">Зарегистрироваться</button>
  </div>

  <div id="appBox" class="hidden">
    <div class="top-bar">
      <span>Привет, <b id="meName"></b>!</span>
      <div class="top-bar-actions">
        <button class="icon-btn" onclick="openThemeModal()" title="Тема">🌓</button>
        <a id="adminLink" href="/admin.html" class="hidden"><button>⚙️ Админ</button></a>
        <button onclick="logout()">Выйти</button>
      </div>
    </div>

    <h2>Создать комнату</h2>
    <input id="roomName" placeholder="Название комнаты" />
    <div class="type-row">
      <select id="videoType" onchange="onVideoTypeChange()">
        <option value="youtube_twitch">YouTube / Twitch (запись)</option>
        <option value="drive">Google Диск</option>
      </select>
      <button type="button" class="info-btn" onclick="toggleInfoPopup()">i</button>
    </div>
    <div id="infoPopup" class="info-popup hidden"></div>
    <input id="videoUrl" placeholder="Ссылка на видео" />
    <button onclick="createRoom()">Создать</button>

    <h2>Войти по ключу</h2>
    <input id="joinCodeInput" placeholder="Ключ комнаты" />
    <button onclick="joinByCode()">Войти</button>

    <h2>Мои комнаты</h2>
    <input id="searchInput" placeholder="Фильтр по названию" oninput="loadMyRooms()" />
    <div id="roomList"></div>
  </div>

  <div id="themeSettingsModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('themeSettingsModal')">✕</button>
      <h3>Тема оформления</h3>
      <label class="theme-option">
        <input type="radio" name="themeChoice" value="light" onchange="setTheme('light')" /> Светлая
      </label>
      <label class="theme-option">
        <input type="radio" name="themeChoice" value="dark" onchange="setTheme('dark')" /> Тёмная
      </label>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
