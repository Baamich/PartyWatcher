<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/index.css" />
  <title>PartyWatcher</title>
</head>
<body>
  <div id="authBox">
    <h2>Вход</h2>
    <input id="loginInput" placeholder="Логин или email" />
    <input id="passwordInput" type="password" placeholder="Пароль" />
    <button onclick="login()">Войти</button>

    <h2>Регистрация</h2>
    <input id="regUsername" placeholder="Username" />
    <input id="regEmail" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Пароль" />
    <button onclick="register()">Зарегистрироваться</button>
  </div>

  <div id="appBox" class="hidden">
    <div class="page-header">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="15"
                fill="none" stroke="var(--border)" stroke-width="2" />
          <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9"
                fill="none" stroke="var(--accent)" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" />
          <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18"
                fill="none" stroke="var(--logo-alt)" stroke-width="6"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
      </div>

      <div class="header-right">
        <div class="corner-menu">
          <span class="corner-name" id="meName"></span>
          <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
          <button class="icon-btn" onclick="logout()">Выйти</button>
        </div>
        <a id="adminLink" href="/admin.html" class="hidden"><button class="icon-btn">Админ</button></a>
      </div>
    </div>

    <div class="layout">
      <div class="col-left">
        <h2>Создать комнату</h2>
        <input id="roomName" placeholder="Название комнаты" />
        <div class="type-row">
          <select id="videoType" onchange="onVideoTypeChange()">
            <option value="youtube_twitch">YouTube / Twitch (запись)</option>
            <option value="drive">Google Диск</option>
            <option value="player_capture">Захват плеера (фильм / сериал)</option>
            <option value="direct">Прямая ссылка на видео</option>
          </select>
          <button type="button" class="info-btn" onclick="toggleInfoPopup()">i</button>
          <button type="button" class="lock-btn lock-private" id="privacyToggle" onclick="togglePrivacy()">🔒</button>
        </div>
        <div id="infoPopup" class="info-popup hidden"></div>
        <input id="videoUrl" placeholder="Ссылка на видео" />
        <button onclick="createRoom()">Создать</button>

        <h2>Войти по ключу</h2>
        <input id="joinCodeInput" placeholder="Ключ комнаты" />
        <button onclick="joinByCode()">Войти</button>
      </div>

      <div class="col-right">
        <h2>Мои комнаты</h2>
        <input id="searchInput" placeholder="Фильтр по названию" oninput="loadMyRooms()" />
        <div id="roomList"></div>

        <h2>Публичные комнаты</h2>
        <div id="publicRoomList"></div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
