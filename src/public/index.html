<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>PartyWatcher</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; }
    input, button, select { display: block; width: 100%; margin: 6px 0; padding: 8px; }
    .hidden { display: none; }
    #roomList div { padding: 8px; border: 1px solid #ddd; margin: 4px 0; cursor: pointer; }
    .room-item { border: 1px solid #ddd; padding: 10px; margin: 6px 0; }
    .room-main { display: flex; gap: 8px; align-items: center; }
    .room-footer { display: flex; flex-direction: column; align-items: center; margin-top: 10px; }
    .room-footer button { width: auto; padding: 8px 24px; }
    .countdown { font-size: 11px; color: #999; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="authBox">
    <h2>Вход</h2>
    <input id="loginInput" placeholder="Логин или email" />
    <input id="passwordInput" type="password" placeholder="Пароль" />
    <button onclick="login()">Войти</button>

    <h2>Регистрация</h2>
    <input id="regUsername" placeholder="Username" />
    <input id="regEmail" placeholder="Email" />
    <input id="regPassword" type="password" placeholder="Пароль" />
    <button onclick="register()">Зарегистрироваться</button>
  </div>

  <div id="appBox" class="hidden">
    <p>Привет, <b id="meName"></b>! <button onclick="logout()">Выйти</button></p>

    <h2>Создать комнату</h2>
    <input id="roomName" placeholder="Название комнаты" />
    <select id="videoType" onchange="onVideoTypeChange()">
      <option value="direct">Прямая ссылка (mp4/m3u8)</option>
      <option value="youtube">YouTube</option>
      <option value="upload">Загрузить файл (до 10GB)</option>
    </select>
    <input id="videoUrl" placeholder="Ссылка на видео" />
    <input id="videoFile" type="file" accept="video/*" class="hidden" />
    <button onclick="createRoom()">Создать</button>
    <a id="adminLink" href="/admin.html" class="hidden"><button>Админ-панель</button></a>
    <h2>Войти по ключу</h2>
    <input id="joinCodeInput" placeholder="Ключ комнаты" />
    <button onclick="joinByCode()">Войти</button>

    <h2>Мои комнаты</h2>
    <input id="searchInput" placeholder="Фильтр по названию" oninput="loadMyRooms()" />
    <div id="roomList"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
