<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <title>Админка — PartyWatcher</title>
</head>
<body>
  <div class="corner-menu">
    <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" onclick="location.href='/index.html'">← Назад</button>
  </div>

  <h2>Панель администратора</h2>

  <div class="admin-grid">
    <div class="panel panel-update">
      <h3>Обновление</h3>
      <button onclick="runUpdate()">Обновить с GitHub (последний коммит)</button>
      <div id="log"></div>
    </div>

    <div class="panel panel-commits">
      <h3>История коммитов</h3>
      <input
        type="text"
        id="commitSearch"
        placeholder="Поиск по хэшу или сообщению..."
        oninput="filterCommits()"
      />
      <div id="commitList" class="commit-list">Загрузка...</div>
      <button id="revertBtn" onclick="revertToCommit()" disabled>Вернуться к коммиту</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
