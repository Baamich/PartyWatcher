<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <title>Админка — PartyWatcher</title>
</head>
<body>
  <div class="corner-menu">
    <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
    <button class="icon-btn" onclick="location.href='/index.html'">← Назад</button>
        <button class="icon-btn support-admin-btn" id="supportAdminBtn" type="button">
      Жалобы
      <span class="support-badge" id="supportBadge">0</span>
    </button>
  </div>

  <h2>Панель администратора</h2>

  <div class="admin-grid">
    <div class="panel panel-update">
      <h3>Обновление</h3>
      <button onclick="runUpdate()">Обновить с GitHub (последний коммит)</button>
      <div id="log"></div>
    </div>

    <div class="panel panel-commits">
      <h3>История коммитов</h3>
      <input
        type="text"
        id="commitSearch"
        placeholder="Поиск по хэшу или сообщению..."
        oninput="filterCommits()"
      />
      <div id="commitList" class="commit-list">Загрузка...</div>
      <button id="revertBtn" onclick="revertToCommit()" disabled>Вернуться к коммиту</button>
    </div>
  </div>

    <div id="supportAdminOverlay" class="support-admin-overlay hidden">
    <div class="support-admin-panel">
      <div class="support-admin-header">
        <h3>Обращения в поддержку</h3>
        <button type="button" class="modal-close" id="supportAdminClose">×</button>
      </div>
      <div class="support-tabs">
        <button type="button" class="support-tab active" data-status="unread">Непрочитанные</button>
        <button type="button" class="support-tab" data-status="accepted">Приняты</button>
        <button type="button" class="support-tab" data-status="trivial">Пустяк</button>
      </div>
      <div id="supportTicketsList" class="support-tickets-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
