<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <script src="/js/i18n.js?v=5" data-ns="widgets,alerts"></script>
  <script src="/js/theme.js?v=2"></script>
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/workbench/float.css?v=1" />
  <title data-i18n="common.float.title">Party Watcher — Мини-пульт стримера</title>
</head>
<body class="fl">
  <header class="fl-top">
    <span id="flLive" class="fl-live" data-i18n="widgets.float.offline">Не в эфире</span>
    <b id="flUptime" class="fl-uptime" data-no-i18n></b>
    <span class="fl-stat" data-i18n-title="widgets.float.viewers" title="Зрители">👀 <b id="flViewers" data-no-i18n>0</b></span>
    <span class="fl-stat" data-i18n-title="widgets.float.followers" title="Подписчики">❤ <b id="flFollowers" data-no-i18n>0</b></span>
  </header>
  <nav class="fl-tabs" role="tablist">
    <button type="button" class="fl-tab on" data-tab="chat" data-i18n="widgets.float.tabChat">Чат</button>
    <button type="button" class="fl-tab" data-tab="widgets" data-i18n="widgets.float.tabWidgets">Виджеты</button>
    <button type="button" class="fl-tab" data-tab="events"><span data-i18n="widgets.float.tabEvents">События</span> <i id="flEvBadge" class="fl-badge" hidden data-no-i18n></i></button>
  </nav>

  <section id="flChat" class="fl-pane">
    <div id="flMsgs" class="fl-msgs" data-no-i18n></div>
    <form id="flForm" class="fl-form">
      <div class="fl-input-wrap"><input id="flInput" type="text" maxlength="500" autocomplete="off" data-i18n-placeholder="widgets.float.chatPh" placeholder="Сообщение или /команда" /></div>
      <button type="submit" class="icon-btn" data-i18n-title="widgets.float.send" title="Отправить">➤</button>
    </form>
  </section>
  <section id="flWidgets" class="fl-pane" hidden></section>
  <section id="flEvents" class="fl-pane" hidden>
    <div id="flEvList" class="fl-evlist" data-no-i18n></div>
  </section>
  <div id="flMsg" class="fl-msg" hidden></div>

  <script src="/js/api.js?v=2"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat-badges.js?v=1"></script>
  <script src="/js/chat-emotes.js?v=2"></script>
  <script src="/js/chat-slash.js?v=1"></script>
  <script src="/alerts/catalog.js?v=1"></script>
  <script src="/alerts/render.js?v=1"></script>
  <script src="/widgets/catalog.js?v=1"></script>
  <script src="/widgets/render.js?v=1"></script>
  <script src="/widgets/controls.js?v=1"></script>
  <script src="/workbench/float.js?v=1"></script>
</body>
</html>
