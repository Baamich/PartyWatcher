<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/workbench/workbench.css" />
  <title>PartyWatcher — Видеостудия</title>
</head>
<body>
  <div class="page-header">
    <a href="/streams.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
        <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-stack">
        <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
        <span class="brand-live-tag">LIVE</span>
      </span>
    </a>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn" onclick="goProfile()">← Профиль</button>
        <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
      </div>
    </div>
  </div>

  <div class="wb-outer">
    <div class="wb-subpage">
      <nav class="wb-nav wb-nav-static">
        <button type="button" class="wb-nav-btn" onclick="location.href='/workbench.html'">📡 Управление трансляцией</button>
        <button type="button" class="wb-nav-btn active">🎬 Видеостудия</button>
        <button type="button" class="wb-nav-btn" onclick="alert('Скоро появится')">📰 Новости</button>
        <button type="button" class="wb-nav-btn" onclick="location.href='/workbench/channel-activity.html'">🛡️ Актив канала</button>
      </nav>

      <div class="wb-subpage-main">
        <h1 class="wb-subpage-title">🎬 Видеостудия</h1>
        <p class="wb-subpage-hint">Записи хранятся 3 дня (после публикации тоже удаляются с профиля).</p>
        <div id="vodList"></div>
      </div>
    </div>
  </div>

  <div id="editVodModal" class="modal hidden">
    <div class="modal-content" style="min-width:min(420px,92vw)">
      <button type="button" class="modal-close" onclick="closeEditVod()">×</button>
      <h3 style="margin:0 0 12px">Редактировать запись</h3>
      <label class="auth-label">Название</label>
      <input id="editVodTitle" maxlength="140" />
      <label class="auth-label">Описание</label>
      <textarea id="editVodDesc" rows="4" maxlength="2000" style="width:100%;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;resize:vertical"></textarea>
      <button type="button" class="auth-submit" onclick="saveEditVod()">Сохранить</button>
    </div>
  </div>

  <div id="delVodModal" class="modal hidden">
    <div class="modal-content" style="min-width:min(360px,92vw)">
      <button type="button" class="modal-close" onclick="closeDelVod()">×</button>
      <h3 style="margin:0 0 10px">Удалить запись?</h3>
      <p class="wb-subpage-hint" style="margin-bottom:16px">Файл будет удалён навсегда. С профиля тоже исчезнет.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="icon-btn vod-btn-danger" onclick="confirmDelVod()">Да, удалить</button>
        <button type="button" class="icon-btn" onclick="closeDelVod()">Отмена</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/workbench/videos.js"></script>
</body>
</html>
