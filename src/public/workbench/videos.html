<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/i18n.js?v=4" data-ns="workbench,videos"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/workbench/workbench.css" />
  <title data-i18n="videos.pageTitle">PartyWatcher — Видеостудия</title>
</head>
<body>
  <div class="page-header">
    <div class="brand-row">
      <a href="/streams.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
          <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-stack">
          <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
          <span class="brand-live-tag">LIVE</span>
        </span>
      </a>
      <div data-lang-switch></div>
    </div>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn" data-click="goProfile" data-i18n="workbench.profile">← Профиль</button>
        <button class="icon-btn theme-toggle" data-click="toggleTheme" data-i18n-title="common.header.theme">🌙</button>
      </div>
    </div>
  </div>

  <div class="wb-outer">
    <div class="wb-subpage">
      <nav class="wb-nav wb-nav-static">
        <button type="button" class="wb-nav-btn" data-href="/workbench/news.html" data-i18n="workbench.nav.news">📰 Новости</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench.html" data-i18n="workbench.nav.stream">📡 Управление трансляцией</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/videos.html" data-i18n="workbench.nav.videos">🎬 Видеостудия</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/channel-activity.html" data-i18n="workbench.nav.activity">🛡️ Актив канала</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/constructor.html" data-i18n="workbench.nav.constructor">🧩 Конструктор</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/presets.html" data-i18n="workbench.nav.presets">🎨 Пре-сеты</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/docs.html" data-i18n="workbench.nav.docs">📚 Документация</button>
      </nav>

      <div class="wb-subpage-main">
        <h1 class="wb-subpage-title" data-i18n="workbench.nav.videos">🎬 Видеостудия</h1>
        <p class="wb-subpage-hint" data-i18n="videos.hint">Записи хранятся 3 дня (после публикации тоже удаляются с профиля).</p>
        <div id="vodList"></div>
      </div>
    </div>
  </div>

  <div id="editVodModal" class="modal hidden">
    <div class="modal-content" style="min-width:min(420px,92vw)">
      <button type="button" class="modal-close" data-click="closeEditVod">×</button>
      <h3 style="margin:0 0 12px" data-i18n="videos.editTitle">Редактировать запись</h3>
      <label class="auth-label" data-i18n="videos.name">Название</label>
      <input id="editVodTitle" maxlength="140" />
      <label class="auth-label" data-i18n="videos.desc">Описание</label>
      <textarea id="editVodDesc" rows="4" maxlength="2000" style="width:100%;font-family:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;resize:vertical"></textarea>
      <button type="button" class="auth-submit" data-click="saveEditVod" data-i18n="common.save">Сохранить</button>
    </div>
  </div>

  <div id="delVodModal" class="modal hidden">
    <div class="modal-content" style="min-width:min(360px,92vw)">
      <button type="button" class="modal-close" data-click="closeDelVod">×</button>
      <h3 style="margin:0 0 10px" data-i18n="videos.del.title">Удалить запись?</h3>
      <p class="wb-subpage-hint" style="margin-bottom:16px" data-i18n="videos.del.text">Файл будет удалён навсегда. С профиля тоже исчезнет.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="icon-btn vod-btn-danger" data-click="confirmDelVod" data-i18n="videos.del.ok">Да, удалить</button>
        <button type="button" class="icon-btn" data-click="closeDelVod" data-i18n="common.dialog.cancel">Отмена</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/js/minipip.js?v=2"></script>
  <script src="/workbench/videos.js?v=2"></script>
</body>
</html>
