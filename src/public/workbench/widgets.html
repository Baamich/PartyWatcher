<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/i18n.js?v=5" data-ns="workbench,widgets,alerts,presets"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/workbench/workbench.css?v=3" />
  <link rel="stylesheet" href="/workbench/cards.css?v=1" />
  <link rel="stylesheet" href="/workbench/presets.css?v=2" />
  <link rel="stylesheet" href="/workbench/widgets.css?v=1" />
  <title data-i18n="widgets.pageTitle">Party Watcher — Виджеты</title>
</head>
<body>
    <div class="page-header">
    <div class="brand-row">
      <a href="/streams.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
          <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-stack">
          <span class="brand-text"><span class="brand-party">Party</span> <span class="brand-watcher">Watcher</span></span>
          <span class="brand-live-tag" data-no-i18n>LIVE</span>
        </span>
      </a>
      <div data-lang-switch></div>
    </div>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn" id="profileBtn" data-click="goProfile" data-i18n="workbench.profile">← Стрим-профиль</button>
        <button class="icon-btn theme-toggle" data-click="toggleTheme" data-i18n-title="common.header.theme">🌙</button>
        <button class="icon-btn" data-click="resetCardsLayout" data-i18n="workbench.resetLayout">↺ По умолчанию</button>
      </div>
    </div>
  </div>

  <div class="wb-outer">
    <div id="cwCanvas" class="wb-canvas cw-canvas">
      <nav id="wbNavFixed" class="wb-nav">
        <button type="button" class="wb-nav-btn" data-href="/workbench/news.html" data-i18n="workbench.nav.news">📰 Новости</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench.html" data-i18n="workbench.nav.stream">📡 Управление трансляцией</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/events.html" data-i18n="workbench.nav.events">🔔 События</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/widgets.html" data-i18n="workbench.nav.widgets">⏱️ Виджеты</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/rewards.html" data-i18n="workbench.nav.rewards">🎁 Награды</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/stats.html" data-i18n="workbench.nav.stats">📊 Статистика</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/videos.html" data-i18n="workbench.nav.videos">🎬 Видеостудия</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/channel-activity.html" data-i18n="workbench.nav.activity">🛡️ Актив канала</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/constructor.html" data-i18n="workbench.nav.constructor">🧩 Конструктор</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/presets.html" data-i18n="workbench.nav.presets">🎨 Пре-сеты</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/docs.html" data-i18n="workbench.nav.docs">📚 Документация</button>
      </nav>

      <!-- сверху: мини-пульт поверх окон, док для OBS, ключ -->
      <div id="cwTopBar" class="cw-topbar">
        <button type="button" id="wgFloat" class="icon-btn wg-float-btn" data-i18n="common.float.open" data-i18n-title="common.float.hint">📌 Поверх окон</button>
        <button type="button" id="wgDock" class="icon-btn" data-i18n="widgets.float.dock">🧩 Ссылка на док для OBS</button>
        <span class="cw-topbar-label" data-i18n="widgets.key.label">Ключ событий</span>
        <code id="wgKey" class="cw-key" data-no-i18n>—</code>
        <a class="icon-btn" href="/workbench/events.html" data-i18n="widgets.key.manage">🔑 Сменить ключ</a>
        <a class="cw-doc" href="/workbench/docs.html#widgets" data-i18n="widgets.key.docs">📖 Как подключить</a>
      </div>

      <!-- справа: добавить виджет -->
      <aside id="cwPicker" class="cw-picker">
        <div class="cw-picker-title" data-i18n="widgets.picker.title">Добавить виджет</div>
        <div class="cw-picker-sub" id="wgCount"></div>
        <div id="wgTypes" class="wg-types"></div>
      </aside>

      <!-- карточки виджетов создаёт widgets.js -->
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/alerts/catalog.js?v=1"></script>
  <script src="/alerts/render.js?v=1"></script>
  <script src="/widgets/catalog.js?v=1"></script>
  <script src="/widgets/render.js?v=1"></script>
  <script src="/widgets/controls.js?v=1"></script>
  <script src="/js/pw-float.js?v=1"></script>
  <script src="/workbench/presets-shared.js?v=3"></script>
  <script src="/workbench/canvas-windows.js?v=1"></script>
  <script src="/workbench/widgets.js?v=1"></script>
  <script src="/js/minipip.js?v=2"></script>
  <script src="/js/live-notify.js?v=1"></script>
</body>
</html>
