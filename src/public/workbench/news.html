<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/i18n.js?v=4" data-ns="workbench,news"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/workbench/workbench.css" />
  <link rel="stylesheet" href="/workbench/news.css?v=2" />
  <title data-i18n="news.pageTitle">PartyWatcher — Новости</title>
</head>
<body>
  <div class="page-header">
    <div class="brand-row">
      <a href="/streams.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
          <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-stack">
          <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
          <span class="brand-live-tag">LIVE</span>
        </span>
      </a>
      <div data-lang-switch></div>
    </div>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn" data-click="goProfile" data-i18n="workbench.profile">← Профиль</button>
        <button class="icon-btn theme-toggle" data-click="toggleTheme" data-i18n-title="common.header.theme">🌙</button>
      </div>
    </div>
  </div>

  <div class="wb-outer">
    <div class="wb-subpage">
      <nav class="wb-nav wb-nav-static">
        <button type="button" class="wb-nav-btn" data-href="/workbench/news.html" data-i18n="workbench.nav.news">📰 Новости</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench.html" data-i18n="workbench.nav.stream">📡 Управление трансляцией</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/videos.html" data-i18n="workbench.nav.videos">🎬 Видеостудия</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/channel-activity.html" data-i18n="workbench.nav.activity">🛡️ Актив канала</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/constructor.html" data-i18n="workbench.nav.constructor">🧩 Конструктор</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/presets.html" data-i18n="workbench.nav.presets">🎨 Пре-сеты</button>
        <button type="button" class="wb-nav-btn" data-href="/workbench/docs.html" data-i18n="workbench.nav.docs">📚 Документация</button>
      </nav>


      <div class="wb-subpage-main">
        <section class="news-head">
          <div>
            <h1 class="wb-subpage-title" data-i18n="workbench.nav.news">📰 Новости</h1>
            <div class="news-filter">
              <label><span data-i18n="news.from">С</span> <input type="date" id="newsFrom" /></label>
              <label><span data-i18n="news.to">По</span> <input type="date" id="newsTo" /></label>
              <button type="button" class="icon-btn" id="newsResetBtn" data-i18n="news.reset">Сбросить</button>
            </div>
          </div>
          <button type="button" class="icon-btn news-create-btn hidden" id="newsCreateBtn" data-i18n="news.create">＋ Создать новость</button>
        </section>

        <div id="newsList" class="news-list"></div>
      </div>
    </div>
  </div>

  <div id="newsModal" class="modal hidden">
    <div class="modal-content news-modal-content">
      <button type="button" class="modal-close" data-click="closeNewsModal">×</button>
      <h3 id="newsModalTitle" style="margin:0 0 6px" data-i18n="news.newTitle">Новая новость</h3>
      <p class="wb-hint" id="newsDateInfo"></p>

      <label class="auth-label" for="newsTitleInput" data-i18n="news.titleLabel">Заголовок</label>
      <input id="newsTitleInput" maxlength="140" spellcheck="true" lang="ru" placeholder="Что нового?" data-i18n-placeholder="news.titlePh" />
      <div id="newsTitleSpell" class="news-spell"></div>

      <label class="auth-label" data-i18n="news.image">Картинка-превью (необязательно)</label>
      <div class="news-image-row">
        <input type="file" id="newsImageInput" accept="image/png,image/jpeg,image/webp" />
        <button type="button" class="icon-btn hidden" id="newsImageRemove" data-i18n="news.imageRemove">Убрать</button>
      </div>
      <img id="newsImagePreview" class="news-image-preview hidden" alt="" />

      <label class="auth-label" for="newsBodyInput" data-i18n="news.body">Описание</label>
      <textarea id="newsBodyInput" rows="8" maxlength="5000" spellcheck="true" lang="ru" placeholder="Что изменилось" data-i18n-placeholder="news.bodyPh"></textarea>
      <div id="newsBodySpell" class="news-spell"></div>

      <p id="newsFormError" class="news-form-error hidden"></p>
      <button type="button" class="auth-submit" id="newsPublishBtn" data-click="publishNews" data-i18n="news.publish">Опубликовать</button>
    </div>
  </div>

  <div id="delNewsModal" class="modal hidden">
    <div class="modal-content" style="min-width:min(360px,92vw)">
      <button type="button" class="modal-close" data-click="closeDelNews">×</button>
      <h3 style="margin:0 0 10px" data-i18n="news.del.title">Удалить новость?</h3>
      <p class="wb-subpage-hint" style="margin-bottom:16px" data-i18n="news.del.text">Она исчезнет у всех.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button type="button" class="icon-btn vod-btn-danger" data-click="confirmDelNews" data-i18n="news.del.ok">Да, удалить</button>
        <button type="button" class="icon-btn" data-click="closeDelNews" data-i18n="common.dialog.cancel">Отмена</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/js/minipip.js?v=2"></script>
  <script src="/workbench/news.js?v=3"></script>
</body>
</html>
