<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/i18n.js?v=5" data-ns="overlay"></script>
  <title data-i18n="overlay.pageTitle">PartyWatcher — Чат для OBS</title>
  <style>
      /* Все настройки вида собраны в переменные: их можно менять параметрами в ссылке или своим CSS в OBS */
    :root {
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --fs: 22px;
      --text: #ffffff;
      --msg-bg: transparent;
      --owner-bg: #e5484d;
      --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
      --gap: 6px;
      --weight: 400;
      --radius: 8px;
      --pad: 2px 8px;
      --stroke-w: 0px;
      --stroke-c: transparent;
      --bw: 0px;
      --bc: transparent;
      --blur: 0px;
      --align: flex-start;
      --talign: left;
      --anim: msg-in;
      --maxw: 100%;
      --op: 1;
      --italic: normal;
      --ls: 0px;
      --lh: 1.3;
      --ncaps: none;
      --glow: none;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

    #chat {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: var(--gap);
      overflow: hidden;
      font-family: var(--font);
      opacity: var(--op);
    }
    #chat.top { top: 0; bottom: auto; justify-content: flex-start; }
    #chat.layout-bar { padding: 0; gap: 0; }
    #chat.layout-row { flex-direction: row; align-items: flex-end; justify-content: flex-end; flex-wrap: nowrap; }

    .msg.hl { background: linear-gradient(120deg, rgba(124, 58, 237, 0.55), rgba(219, 39, 119, 0.45)); border-radius: 8px; padding: 4px 10px; }
    .msg.raid { color: #fff; font-weight: 800; background: linear-gradient(120deg, #7c3aed, #db2777 60%, #f97316); border-radius: 8px; padding: 4px 10px; }
    .raid-banner {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      padding: 12px 22px; border-radius: 14px; color: #fff; font-size: 22px; font-weight: 900; white-space: nowrap;
      background: linear-gradient(120deg, #7c3aed, #db2777 60%, #f97316); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      animation: raid-in 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.3); transition: opacity 0.6s ease;
    }
    .raid-banner.out { opacity: 0; }
    @keyframes raid-in { from { transform: translate(-50%, -150%); } }
    .msg {
      align-self: var(--align);
      text-align: var(--talign);
      max-width: var(--maxw);
      box-sizing: border-box;
      padding: var(--pad);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--msg-bg);
      font-size: var(--fs);
      font-weight: var(--weight);
      font-style: var(--italic);
      letter-spacing: var(--ls);
      line-height: var(--lh);
      word-break: break-word;
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--stroke-w) var(--stroke-c);
      paint-order: stroke fill;
      border: var(--bw) solid var(--bc);
      border-left: var(--stripe-w, var(--bw)) solid var(--stripe-c, var(--bc));
      box-shadow: var(--glow);
      backdrop-filter: blur(var(--blur));
      animation: var(--anim) 0.2s ease-out;
    }
    #chat.layout-bar .msg {
      align-self: stretch;
      width: 100%;
      max-width: 100%;
      border-radius: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chat.layout-row .msg { align-self: auto; flex-shrink: 0; white-space: nowrap; }
    .msg.out { opacity: 0; transition: opacity 0.6s ease; }

    .nick { font-weight: 700; text-transform: var(--ncaps); }
    .nick--owner {
      background: var(--owner-bg);
      color: #fff;
      padding: 1px 8px;
      border-radius: 6px;
      text-shadow: none;
      -webkit-text-stroke: 0;
    }
    .nick.plate {
      padding: 1px 8px;
      border-radius: 6px;
      text-shadow: none;
      -webkit-text-stroke: 0;
    }
    .src {
      font-size: 0.6em;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.22);
      text-shadow: none;
      -webkit-text-stroke: 0;
      vertical-align: middle;
    }
    #chat.nosrc .src { display: none; }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes msg-pop {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes msg-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat-badges.js?v=1"></script>
  <script src="/js/chat-emotes.js?v=2"></script>
  <script src="/overlay/chat.js?v=7"></script>
</body>
</html>
