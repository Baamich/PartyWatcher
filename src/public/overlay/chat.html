<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PartyWatcher — Чат для OBS</title>
  <style>
    /* Все настройки вида собраны в переменные: их можно менять параметрами в ссылке или своим CSS в OBS */
    :root {
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --fs: 22px;
      --text: #ffffff;
      --msg-bg: transparent;
      --owner-bg: #e5484d;
      --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
      --gap: 6px;
      --weight: 400;
      --radius: 8px;
      --pad: 2px 8px;
      --stroke-w: 0px;
      --stroke-c: transparent;
      --bw: 0px;
      --bc: transparent;
      --blur: 0px;
      --align: flex-start;
      --talign: left;
      --anim: msg-in;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

    #chat {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: var(--gap);
      overflow: hidden;
      font-family: var(--font);
    }
    .msg {
      align-self: var(--align);
      text-align: var(--talign);
      max-width: 100%;
      box-sizing: border-box;
      padding: var(--pad);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--msg-bg);
      font-size: var(--fs);
      font-weight: var(--weight);
      line-height: 1.3;
      word-break: break-word;
      text-shadow: var(--text-shadow);
      -webkit-text-stroke: var(--stroke-w) var(--stroke-c);
      paint-order: stroke fill;
      border: var(--bw) solid var(--bc);
      backdrop-filter: blur(var(--blur));
      animation: var(--anim) 0.2s ease-out;
    }
    .msg.out { opacity: 0; transition: opacity 0.6s ease; }
    .nick { font-weight: 700; }
    .nick--owner {
      background: var(--owner-bg);
      color: #fff;
      padding: 1px 8px;
      border-radius: 6px;
      -webkit-text-stroke: 0;
      text-shadow: none;
    }
    .src {
      font-size: 0.6em;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      -webkit-text-stroke: 0;
      background: rgba(255, 255, 255, 0.22);
      text-shadow: none;
      vertical-align: middle;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes msg-pop {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes msg-fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/overlay/chat.js?v=2"></script>
</body>
</html>
