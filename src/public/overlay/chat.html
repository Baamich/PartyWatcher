<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PartyWatcher — Чат для OBS</title>
  <style>
    /* Все настройки вида собраны в переменные: их можно менять параметрами в ссылке или своим CSS в OBS */
    :root {
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --fs: 22px;
      --text: #ffffff;
      --msg-bg: transparent;
      --owner-bg: #e5484d;
      --text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9), 0 0 2px rgba(0, 0, 0, 0.9);
      --gap: 6px;
    }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }

    #chat {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      max-height: 100%;
      padding: 8px 12px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: var(--gap);
      overflow: hidden;
      font-family: var(--font);
    }
    .msg {
      align-self: flex-start;
      max-width: 100%;
      box-sizing: border-box;
      padding: 2px 8px;
      border-radius: 8px;
      color: var(--text);
      background: var(--msg-bg);
      font-size: var(--fs);
      line-height: 1.3;
      word-break: break-word;
      text-shadow: var(--text-shadow);
      animation: msg-in 0.2s ease-out;
    }
    .msg.out { opacity: 0; transition: opacity 0.6s ease; }
    .nick { font-weight: 700; }
    .nick--owner {
      background: var(--owner-bg);
      color: #fff;
      padding: 1px 8px;
      border-radius: 6px;
      text-shadow: none;
    }
    .src {
      font-size: 0.6em;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.22);
      text-shadow: none;
      vertical-align: middle;
    }
    @keyframes msg-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="chat"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    (function () {
      // Параметры ссылки (все, кроме key, необязательные):
      //   key     — ключ чата
      //   size    — размер шрифта, px (10–80)
      //   font    — название шрифта, установленного на твоём ПК, например Arial
      //   color   — цвет текста, 6 символов без #, например ffffff
      //   bg      — цвет фона сообщения, 6 символов без #
      //   bgalpha — непрозрачность фона, 0–100 (по умолчанию 60, если указан bg)
      //   owner   — цвет плашки ника владельца, 6 символов без #
      //   shadow  — 0 = выключить тень у текста
      //   fade    — через сколько секунд сообщение исчезает (0 — не исчезает)
      //   max     — сколько сообщений держать на экране (5–100)
      const params = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
      const key = params.get('key') || '';
      const fadeSec = Math.max(0, parseInt(params.get('fade'), 10) || 0);
      const maxMsgs = Math.min(100, Math.max(5, parseInt(params.get('max'), 10) || 30));

      const root = document.documentElement;
      const HEX = /^[0-9a-f]{6}$/i;

      const size = parseInt(params.get('size'), 10);
      if (size >= 10 && size <= 80) root.style.setProperty('--fs', size + 'px');

      const font = params.get('font') || '';
      if (/^[\p{L}\p{N} _-]{1,40}$/u.test(font)) {
        root.style.setProperty('--font', `"${font}", 'Segoe UI', system-ui, sans-serif`);
      }

      const color = params.get('color') || '';
      if (HEX.test(color)) root.style.setProperty('--text', '#' + color);

      const owner = params.get('owner') || '';
      if (HEX.test(owner)) root.style.setProperty('--owner-bg', '#' + owner);

      const bg = params.get('bg') || '';
      if (HEX.test(bg)) {
        const r = parseInt(bg.slice(0, 2), 16);
        const g = parseInt(bg.slice(2, 4), 16);
        const b = parseInt(bg.slice(4, 6), 16);
        const rawAlpha = parseInt(params.get('bgalpha'), 10);
        const alpha = Number.isFinite(rawAlpha) ? Math.min(100, Math.max(0, rawAlpha)) : 60;
        root.style.setProperty('--msg-bg', `rgba(${r}, ${g}, ${b}, ${alpha / 100})`);
      }

      if (params.get('shadow') === '0') root.style.setProperty('--text-shadow', 'none');

      const box = document.getElementById('chat');

      function showError(text) {
        box.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'msg';
        row.textContent = text;
        box.appendChild(row);
      }

      if (!key) {
        showError('В ссылке нет ключа (#key=...)');
        return;
      }

      function addMessage(msg) {
        if (!msg || msg.deleted) return;

        const row = document.createElement('div');
        row.className = 'msg';
        row.dataset.id = msg._id;

        if (msg.external && msg.source) {
          const s = document.createElement('span');
          s.className = 'src';
          s.textContent = msg.source;
          row.appendChild(s);
        }

        const nick = document.createElement('span');
        nick.className = 'nick' + (msg.isOwner ? ' nick--owner' : '');
        nick.textContent = msg.senderUsername;
        if (!msg.isOwner && /^#[0-9a-f]{6}$/i.test(msg.nickColor || '')) nick.style.color = msg.nickColor;
        row.appendChild(nick);

        const sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = ': ';
        row.appendChild(sep);

        const text = document.createElement('span');
        text.className = 'text';
        text.textContent = msg.text;
        row.appendChild(text);

        box.appendChild(row);

        while (box.children.length > maxMsgs) box.removeChild(box.firstChild);

        if (fadeSec > 0) {
          setTimeout(() => {
            row.classList.add('out');
            setTimeout(() => row.remove(), 700);
          }, fadeSec * 1000);
        }
      }

      // в OBS сокет сам переподключается
      const socket = io('/chat', { reconnection: true, reconnectionDelay: 1000, reconnectionDelayMax: 5000 });

      socket.on('connect', () => socket.emit('chat:join', { chatKey: key }));

      socket.on('chat:history', (list) => {
        box.innerHTML = '';
        if (fadeSec === 0) (list || []).forEach(addMessage); // при fade старую историю не показываем
      });
      socket.on('chat:message', addMessage);
      socket.on('chat:message-deleted', ({ messageId }) => {
        box.querySelectorAll('[data-id="' + CSS.escape(String(messageId)) + '"]').forEach((el) => el.remove());
      });
      socket.on('chat:cleared', () => { box.innerHTML = ''; });
      socket.on('chat:overlay-error', (e) => showError((e && e.error) || 'Неверный ключ чата'));
    })();
  </script>
</body>
</html>
