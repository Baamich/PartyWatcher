<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/i18n.js?v=5" data-ns="alerts"></script>
  <title data-i18n="alerts.overlayTitle">PartyWatcher — Алерты</title>
  <style>
    /* оверлей OBS (Browser Source): прозрачный фон, алерт по центру сверху */
    html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%; }
    #stage { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 6vh; }
    #err { position: fixed; left: 12px; bottom: 12px; padding: 8px 12px; border-radius: 8px; background: rgba(0, 0, 0, 0.7);
      color: #fff; font: 600 14px system-ui, sans-serif; }
    #err[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="err" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/alerts/catalog.js?v=1"></script>
  <script src="/alerts/render.js?v=1"></script>
  <script src="/overlay/alerts.js?v=1"></script>
</body>
</html>
