<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/streams/streams.css" />
  <link rel="stylesheet" href="/streams/search.css" />
  <title>PartyWatcher — Поиск стримеров</title>
</head>
<body>
  <div class="page-header">
    <a href="/index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
        <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
    </a>
    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
        <button class="icon-btn" onclick="location.href='/streams.html'">К списку</button>
      </div>
    </div>
  </div>

  <nav class="nav-sidebar">
    <button type="button" class="page-nav-btn" onclick="navigateWithFade('/index.html')">🏠 Комнаты</button>
    <button type="button" class="page-nav-btn active" onclick="navigateWithFade('/streams.html')">📡 Прямые трансляции</button>
  </nav>

  <div class="search-results-layout">
    <div class="streams-search-wrap">
      <input id="searchQueryInput" type="text" autocomplete="off"
             placeholder="Поиск по имени стримера"
             onkeydown="handleSearchKey(event)" />
      <button type="button" class="search-icon-btn" onclick="runSearch()" aria-label="Искать">🔍</button>
    </div>

    <h2 id="resultsHeading" class="results-heading"></h2>
    <div id="resultsGrid" class="streamers-grid"></div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/page-transition.js"></script>
  <script src="/streams/streams.js"></script>
  <script src="/streams/search.js"></script>
</body>
</html>
