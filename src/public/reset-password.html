<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <script src="/js/i18n.js?v=5" data-ns="index,reset"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css?v=2" />
  <link rel="stylesheet" href="/css/index.css?v=4" />
  <title data-i18n="reset.pageTitle">Новый пароль — PartyWatcher</title>
</head>
<body>
  <div id="authBox">
    <div class="auth-card">
      <div class="brand-row reset-title-row">
        <h2 class="auth-title" data-i18n="reset.title">Новый пароль</h2>
        <div data-lang-switch></div>
      </div>
      <div id="resetError" class="auth-error hidden"></div>
      <div id="resetOk" class="support-ok hidden" data-i18n="reset.done">Пароль изменён ✓ Переходим на сайт…</div>

      <div id="resetForm">
        <label class="auth-label" for="newPassword" data-i18n="reset.title">Новый пароль</label>
        <div class="password-wrap">
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="Пароль" data-i18n-placeholder="index.login.password" />
          <button type="button" class="password-toggle" data-click="toggleResetPassword" data-arg="newPassword" aria-label="Показать пароль" data-i18n-aria-label="index.password.show">👁</button>
        </div>

        <ul class="password-rules">
          <li id="ruleLength" class="rule-bad" data-i18n="index.rules.length">Минимум 8 символов</li>
          <li id="ruleUpper" class="rule-bad" data-i18n="index.rules.upper">Первая буква — заглавная латиница (A–Z)</li>
          <li id="ruleLetter" class="rule-bad" data-i18n="index.rules.letter">Есть буквы</li>
          <li id="ruleDigit" class="rule-bad" data-i18n="index.rules.digit">Есть цифры</li>
          <li id="ruleMatch" class="rule-bad" data-i18n="index.rules.match">Пароли совпадают</li>
        </ul>

        <label class="auth-label" for="newPasswordConfirm" data-i18n="index.register.confirm">Повторите пароль</label>
        <div class="password-wrap">
          <input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="Повторите пароль" data-i18n-placeholder="index.register.confirm" />
          <button type="button" class="password-toggle" data-click="toggleResetPassword" data-arg="newPasswordConfirm" aria-label="Показать пароль" data-i18n-aria-label="index.password.show">👁</button>
        </div>

        <button id="resetBtn" class="auth-submit" data-click="submitReset" disabled data-i18n="reset.submit">Сохранить пароль</button>
      </div>

      <p class="auth-switch">
        <a class="auth-link" href="/" data-i18n="reset.home">На главную</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/js/reset-password.js?v=2"></script>
</body>
</html>
