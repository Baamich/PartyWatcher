<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/index.css?v=3" />
  <title>Новый пароль — PartyWatcher</title>
</head>
<body>
  <div id="authBox">
    <div class="auth-card">
      <h2 class="auth-title">Новый пароль</h2>
      <div id="resetError" class="auth-error hidden"></div>
      <div id="resetOk" class="support-ok hidden">Пароль изменён ✓ Переходим на сайт…</div>

      <div id="resetForm">
        <label class="auth-label" for="newPassword">Новый пароль</label>
        <div class="password-wrap">
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="Пароль" />
          <button type="button" class="password-toggle" data-click="toggleResetPassword" data-arg="newPassword" aria-label="Показать пароль">👁</button>
        </div>

        <ul class="password-rules">
          <li id="ruleLength" class="rule-bad">Минимум 8 символов</li>
          <li id="ruleUpper" class="rule-bad">Первая буква — заглавная латиница (A–Z)</li>
          <li id="ruleLetter" class="rule-bad">Есть буквы</li>
          <li id="ruleDigit" class="rule-bad">Есть цифры</li>
          <li id="ruleMatch" class="rule-bad">Пароли совпадают</li>
        </ul>

        <label class="auth-label" for="newPasswordConfirm">Повторите пароль</label>
        <div class="password-wrap">
          <input id="newPasswordConfirm" type="password" autocomplete="new-password" placeholder="Повторите пароль" />
          <button type="button" class="password-toggle" data-click="toggleResetPassword" data-arg="newPasswordConfirm" aria-label="Показать пароль">👁</button>
        </div>

        <button id="resetBtn" class="auth-submit" data-click="submitReset" disabled>Сохранить пароль</button>
      </div>

      <p class="auth-switch">
        <a class="auth-link" href="/">На главную</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/js/reset-password.js?v=1"></script>
</body>
</html>
