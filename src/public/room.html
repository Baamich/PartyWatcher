<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Комната — PartyWatcher</title>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/room.css" />
</head>
<body>
  <div id="playerWrap">
    <div id="player"></div>

    <div id="overlay">
      <span id="overlayText">Загрузка комнаты...</span>
      <button id="startBtn" class="hidden" onclick="startWatching()">▶ Начать просмотр</button>
    </div>

    <button id="fullscreenBtn" title="Полноэкранный режим" onclick="toggleFullscreen()">⛶</button>
    <button id="fsChatToggleBtn" class="hidden" onclick="toggleFsChat()">💬</button>

    <div id="fsChatPanel" class="hidden">
      <div id="fsMessages"></div>
      <form id="fsChatForm" onsubmit="return sendMessage(event, true)">
        <input id="fsChatInput" placeholder="Сообщение..." />
        <button type="submit">➤</button>
      </form>
    </div>

    <div id="fsNotice" class="hidden"></div>
  </div>

  <div id="chat">
    <div id="roomHeader">
      <button onclick="location.href='/index.html'">← Назад</button>
      <span>Ключ: <b id="roomCodeValue"></b></span>
      <button onclick="copyRoomLink()">📋 Поделиться</button>
    </div>
    <button onclick="resync()">🔄 Синхронизировать</button>
    <div id="messages"></div>
    <form id="chatForm" onsubmit="return sendMessage(event)">
      <input id="chatInput" placeholder="Сообщение..." />
      <button type="submit">➤</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
