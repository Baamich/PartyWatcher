<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Комната — PartyWatcher</title>
  <style>
    body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; }
    #player { flex: 3; background: #000; }
    #player video, #player iframe, #ytPlayer { width: 100%; height: 100%; border: 0; }
    #chat { flex: 1; display: flex; flex-direction: column; border-left: 1px solid #ddd; }
    #roomHeader { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
    #messages { flex: 1; overflow-y: auto; padding: 8px; }
    #chatForm { display: flex; }
    #chatForm input { flex: 1; }
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="chat">
    <div id="roomHeader">
      <span>Ключ: <b id="roomCodeValue"></b></span>
      <button onclick="copyRoomLink()">📋 Поделиться</button>
    </div>
    <button onclick="resync()">🔄 Синхронизировать</button>
    <div id="messages"></div>
    <form id="chatForm" onsubmit="return sendMessage(event)">
      <input id="chatInput" placeholder="Сообщение..." />
      <button type="submit">➤</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
