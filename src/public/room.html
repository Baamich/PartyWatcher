<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/css/room.css" />
  <title>Комната — PartyWatcher</title>
</head>
<body>
  <div id="playerWrap">
    <div id="player"></div>

    <div id="overlay">
      <span id="overlayText">Загрузка комнаты...</span>
      <button id="startBtn" class="hidden" onclick="startWatching()">▶ Начать просмотр</button>
    </div>

    <button id="fsChatToggleBtn" class="fs-draggable hidden" onclick="toggleFsChat()" title="Чат (зажми, чтобы передвинуть)">💬</button>
    <button id="ccBtn" class="fs-draggable" onclick="toggleSubtitles()" title="Субтитры">CC</button>
    <button id="fullscreenBtn" class="fs-draggable" onclick="toggleFullscreen()" title="Полноэкранный режим (зажми, чтобы передвинуть)">⛶</button>

    <div id="fsChatPanel" class="hidden">
      <div id="fsMessages"></div>
      <form id="fsChatForm" onsubmit="return sendMessage(event, true)">
        <input id="fsChatInput" placeholder="Сообщение..." />
        <button type="submit">➤</button>
      </form>
    </div>

    <div id="fsNotice" class="hidden"></div>
  </div>

  <div id="chat">
    <div id="roomHeader">
      <div id="copyToast" class="copy-toast hidden"></div>
      <button onclick="location.href='/index.html'">← Назад</button>
      <div id="roomMeta">
        <span class="room-meta-line">
          Название:
          <b id="roomNameValue" class="copyable" title="Нажми, чтобы скопировать"></b>
        </span>
        <span class="room-meta-line">
          Ключ:
          <b id="roomCodeValue" class="copyable" title="Нажми, чтобы скопировать"></b>
        </span>
      </div>
      <button class="icon-btn theme-toggle" onclick="toggleTheme()">🌙</button>
      <button onclick="openSettings()">⚙️ <span id="participantCount">0</span></button>
    </div>

    <!-- Вкладки -->
    <div id="viewToggle" class="view-toggle">
      <button id="btnShowChat" class="active" onclick="setViewMode('chat')">Чат</button>
      <button id="btnShowVideo" onclick="setViewMode('video')">Видео</button>
    </div>

    <!-- Панель управления сериями (только хост + только во вкладке Видео) -->
    <div id="hostControls" class="host-controls hidden">
      <div class="episode-row">
        <label>Сезон</label>
        <select id="seasonSelect" onchange="onEpisodeChange()"></select>
      </div>
      <div class="episode-row">
        <label>Серия</label>
        <select id="episodeSelect" onchange="onEpisodeChange()"></select>
      </div>
      <div class="episode-row" id="voiceRow">
        <label>Озвучка</label>
        <select id="voiceSelect" onchange="onEpisodeChange()"></select>
      </div>
    </div>

    <button onclick="resync()">🔄 Синхронизировать</button>

    <div id="messages"></div>
    <form id="chatForm" onsubmit="return sendMessage(event)">
      <input id="chatInput" placeholder="Сообщение..." />
      <button type="submit">➤</button>
    </form>
  </div>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('settingsModal')">✕</button>
      <h3>Участники комнаты</h3>
      <div id="participantsList"></div>
      <button onclick="copyRoomLink()">📋 Скопировать ссылку</button>
      <button id="bannedListBtn" class="hidden" onclick="openBannedList()">Заблокированные</button>
    </div>
  </div>

  <div id="bannedModal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal('bannedModal')">✕</button>
      <h3>Заблокированные пользователи</h3>
      <div id="bannedList"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
