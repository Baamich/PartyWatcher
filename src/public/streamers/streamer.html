<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="/js/theme.js"></script>
  <script src="/js/favicon.js"></script>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/img/favicon-dark.svg" />
  <link rel="stylesheet" href="/css/common.css" />
  <link rel="stylesheet" href="/streamers/streamer.css" />
  <link rel="stylesheet" href="/streamers/live.css" />
  <link rel="stylesheet" href="/streamers/blocks.css" />
  <title>PartyWatcher — Стример</title>
</head>
<body>
  <div class="page-header">
    <a href="/streams.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="var(--border)" stroke-width="2" />
        <path d="M16 46 V18 h9 a8 8 0 0 1 0 16 h-9" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M30 28 l5 18 l6.5-13 l6.5 13 l5-18" fill="none" stroke="var(--logo-alt)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="brand-stack">
        <span class="brand-text"><span class="brand-party">Party</span><span class="brand-watcher">Watcher</span></span>
        <span class="brand-live-tag">LIVE</span>
      </span>
    </a>

    <div class="header-right">
      <div class="corner-menu">
        <button class="icon-btn theme-toggle" data-click="toggleTheme">🌙</button>
        <button class="icon-btn" data-href="/streams.html">Вернуться</button>
      </div>
      <div id="ownerControls" class="owner-controls hidden">
        <button class="icon-btn" id="ownerEditBtn" data-href="/streamers/edit.html">✏️ Редактировать</button>
        <button class="icon-btn" id="ownerWorkbenchBtn" data-href="/workbench.html">🛠️ Творческая студия</button>
      </div>
    </div>
  </div>

  <div id="notFound" class="not-found hidden">
    <p>Стример не найден</p>
  </div>

  <div id="pageContent" class="hidden">

    <!-- ===== аккордеон эфира ===== -->
    <div id="liveStrip" class="live-strip">
      <div class="live-strip-inner">
        <div id="livePlayerWrap" class="live-player-wrap">
          <video id="liveVideo" class="live-video hidden" playsinline muted></video>
          <div id="liveOffline" class="live-offline hidden">Эфира нет</div>

          <div id="liveActivityCatcher"></div>

          <div id="liveOverlay" class="hidden">
            <span id="liveOverlayText">Загрузка эфира...</span>
            <button id="liveStartBtn" class="hidden">🔊 Включить звук</button>
          </div>

          <button id="liveChatToggleBtn" class="live-fs-btn hidden" type="button" title="Чат">💬</button>
          <button id="liveVolumeBtn" class="live-fs-btn" title="Громкость">🔊</button>
          <div id="liveVolumePopup" class="hidden">
            <input id="liveVolumeSlider" type="range" min="0" max="100" value="50">
          </div>
          <button id="liveFullscreenBtn" class="live-fs-btn" title="Полноэкранный режим">⛶</button>
          <button id="liveMiniBtn" class="live-fs-btn hidden" type="button" title="Мини-окно поверх всех окон">⧉</button>

          <button id="liveQualityBtn" class="live-fs-btn live-quality-btn" title="Настройки качества">⚙️</button>
          <div id="liveQualityPopup" class="hidden"></div>

          <!-- плавающий чат в fullscreen (тот же #liveChatSide, просто перестилизуется в CSS) -->
        </div>

        <div id="liveChatSide" class="live-chat-side">
          <div class="live-chat-header">
            <button type="button" id="liveViewersBtn" class="live-viewers-btn" title="Зрители">
              👁 <span id="liveViewersCount">0</span>
            </button>
            <button type="button" id="liveClearChatBtn" class="live-clear-chat-btn hidden" title="Очистить чат">🧹</button>
          </div>
          <div id="liveMessages"></div>
          <form id="liveChatForm">
            <input id="liveChatInput" placeholder="Сообщение..." autocomplete="off" maxlength="500">
            <button type="submit">➤</button>
          </form>
          <div id="liveChatBlocked" class="live-chat-blocked hidden"></div>
          <div id="liveOwnerBar" class="hidden">
            <button type="button" id="liveOwnerSettingsBtn" class="icon-btn">🛠️ Настройки трансляции</button>
          </div>
          <div id="liveChatResizeHandle" title="Потяни, чтобы изменить размер"></div>

          <div id="liveViewersPanel" class="live-viewers-panel">
            <div class="live-viewers-panel-header">
              <span>Зрители</span>
              <button type="button" id="liveViewersClose" class="live-viewers-close" aria-label="Закрыть">×</button>
            </div>
            <div id="liveViewersList" class="live-viewers-list"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== кнопка-шеврон между эфиром и профилем ===== -->
    <div class="live-toggle-wrap">
      <button type="button" id="liveToggleChevronBtn" class="live-toggle-chevron" title="Показать/скрыть эфир" aria-label="Показать/скрыть эфир">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

    <!-- ===== профиль + (когда открыт эфир) колонка записей ===== -->
    <div id="profileRow" class="profile-row">
      <div id="streamerProfile" class="streamer-profile">
        <div id="banner" class="profile-banner"></div>

        <div class="profile-header">
          <button type="button" id="profileAvatarBtn" class="profile-avatar-wrap">
            <div id="profileAvatar" class="profile-avatar"></div>
            <span id="liveBadge" class="live-badge hidden">В ЭФИРЕ</span>
          </button>

          <div class="profile-info">
            <button type="button" id="profileNameBtn" class="profile-name-btn">
              <h1 id="profileName" class="profile-name"></h1>
            </button>
            <p id="profileBioShort" class="profile-bio-short"></p>
            <button type="button" id="bioExpandBtn" class="bio-expand-btn hidden" data-click="openBioModal">…ещё</button>
          </div>
        </div>
      </div>

      <div id="vodColumn" class="vod-column hidden">
        <h3>Записи</h3>
        <div id="vodColumnList"></div>
      </div>
    </div>

    <!-- ===== обычная сетка записей (когда эфир закрыт) ===== -->
    <section id="vodSection" class="vod-section hidden">
      <h2>Записи</h2>
      <div id="vodGrid" class="vod-grid"></div>
    </section>

  </div>

  <div id="bioModal" class="modal hidden">
    <div class="modal-content bio-modal-content">
      <button type="button" class="modal-close" data-click="closeBioModal" aria-label="Закрыть">×</button>
      <h3 id="bioModalName" class="bio-modal-name"></h3>
      <p id="bioModalText" class="bio-modal-text"></p>
    </div>
  </div>

  <div id="liveAuthModal" class="modal hidden">
    <div class="modal-content age-gate-content">
      <button type="button" class="modal-close" id="liveAuthModalClose" aria-label="Закрыть">×</button>
      <div class="age-gate-icon">🔒</div>
      <h3>Войдите, чтобы писать в чат</h3>
      <p class="age-gate-text">Смотреть можно без аккаунта, а для сообщений нужно войти или зарегистрироваться.</p>
      <div class="age-gate-actions">
        <button type="button" id="liveAuthLoginBtn">Войти</button>
        <button type="button" id="liveAuthRegisterBtn" class="icon-btn">Зарегистрироваться</button>
      </div>
    </div>
  </div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/reconnect-schedule.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/actions.js?v=3"></script>
  <script src="/js/wakelock.js"></script>
  <script src="/js/minipip.js"></script>
  <script src="/js/pwlayout.js"></script>
  <script src="/js/pwcache.js"></script>
  <script src="/streamers/pro-view.js?v=2"></script>
  <script src="/streamers/streamer.js?v=2"></script>
</body>
</html>
